; DOOM for the ESP32-2432S028R "Cheap Yellow Display"
; Based on GBADoom (doomhack), itself based on PrBoom.
;
; Build:  pio run
; Flash:  pio run -t upload            (firmware)
;         python tools/flashwad.py --port COM6 (WAD partition)

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
monitor_speed = 115200
upload_speed = 921600
; No upload_port is pinned: COM5/COM6 are machine-specific. Pass
; --upload-port COMx (or -t upload --upload-port) on the command line.

build_unflags = -Os
build_flags =
    -O2
    -I include
    -D CORE_DEBUG_LEVEL=0
